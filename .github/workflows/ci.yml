name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { python: "3.10", extras: "test" }
          - { python: "3.12", extras: "test" }
          - { python: "3.10", extras: "test,video" }
          - { python: "3.12", extras: "test,video" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[${{ matrix.extras }}]
      - run: pytest -q
